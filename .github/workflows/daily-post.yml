name: 서울 문화행사 블로그 자동 발행

on:
  schedule:
    # KST 09:00 (UTC 00:00)
    - cron: "0 0 * * *"
    # KST 12:00 (UTC 03:00) — 화/목/토 제외 (당일 1회 제한 로직이 index.js에서 처리)
    - cron: "0 3 * * 0,1,3,5"
    # KST 15:00 (UTC 06:00) — 화/목/토 제외
    - cron: "0 6 * * 0,1,3,5"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 패키지 설치
        run: npm ci

      - name: 블로그 포스트 생성 및 발행
        env:
          SEOUL_OPEN_DATA_API_KEY: ${{ secrets.SEOUL_OPEN_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          POLICY_NEWS_API_KEY: ${{ secrets.POLICY_NEWS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BLOGGER_IS_DRAFT: "false"
        run: node index.js
